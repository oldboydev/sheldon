# Discovery marker: changing this workflow forces GitHub Actions to re-index the default branch.
name: Build OCR runtime artifacts

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022
            timeoutMinutes: 30
          - platform: darwin-arm64
            runner: macos-14
            timeoutMinutes: 360
          - platform: darwin-x64
            runner: macos-15-intel
            timeoutMinutes: 360
          - platform: linux-x64
            runner: ubuntu-22.04
            timeoutMinutes: 360
        platform: [win32-x64, darwin-arm64, darwin-x64, linux-x64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
      - run: npm ci
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.27.0
        if: matrix.platform == 'win32-x64'
        with:
          msystem: MINGW64
          release: true # Use the release image represented by the graph lock.
          update: false # Do not mutate the locked package graph.
          cache: false # Do not restore mutable package state.
          install: >-
            mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc mingw-w64-x86_64-leptonica
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
      - name: Install macOS build dependencies
        if: startsWith(matrix.platform, 'darwin-')
        run: brew install cmake leptonica ninja pkg-config
      - name: Build Windows runtime
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          scripts/release/build-native-ocr-runtime.ps1
          -Platform ${{ matrix.platform }}
          -Output "$env:RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - name: Build macOS runtime
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        run: >-
          bash scripts/release/build-native-ocr-runtime.sh
          --platform ${{ matrix.platform }}
          --output "$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - name: Sign and notarize macOS runtime
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        env:
          SHELDON_MACOS_SIGNING_IDENTITY: ${{ secrets.SHELDON_MACOS_SIGNING_IDENTITY }}
          SHELDON_MACOS_NOTARY_PROFILE: ${{ secrets.SHELDON_MACOS_NOTARY_PROFILE }}
        run: |
          test -n "$SHELDON_MACOS_SIGNING_IDENTITY" || { echo "macOS signing identity is required" >&2; exit 1; }
          test -n "$SHELDON_MACOS_NOTARY_PROFILE" || { echo "macOS notarization profile is required" >&2; exit 1; }
          runtime="$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
          find "$runtime" -type f -perm -111 -exec codesign --force --options runtime --timestamp --sign "$SHELDON_MACOS_SIGNING_IDENTITY" {} \;
          archive="$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}.zip"
          ditto -c -k --keepParent "$runtime" "$archive"
          xcrun notarytool submit "$archive" --keychain-profile "$SHELDON_MACOS_NOTARY_PROFILE" --wait
          find "$runtime" -type f -perm -111 -exec codesign --verify --deep --strict {} \;
      - name: Build Linux runtime
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: >-
          node scripts/release/build-ocr-runtime.mjs
          --platform ${{ matrix.platform }}
          --output "$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - name: Verify managed yt-dlp runtime
        run: >-
          node scripts/release/verify-youtube-runtime.mjs
          --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/ocr-runtime-${{ matrix.platform }}
          if-no-files-found: error
