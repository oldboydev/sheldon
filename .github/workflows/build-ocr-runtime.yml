name: Build OCR runtime artifacts

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-13
          - platform: linux-x64
            runner: ubuntu-22.04
        platform: [win32-x64, darwin-arm64, darwin-x64, linux-x64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.27.0
        if: matrix.platform == 'win32-x64'
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc mingw-w64-x86_64-leptonica
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
      - name: Install macOS build dependencies
        if: startsWith(matrix.platform, 'darwin-')
        run: brew install cmake leptonica ninja pkg-config
      - name: Build Windows runtime
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        run: >-
          scripts/release/build-native-ocr-runtime.ps1
          --platform ${{ matrix.platform }}
          --output "$env:RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - name: Build macOS runtime
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        run: >-
          scripts/release/build-native-ocr-runtime.sh
          --platform ${{ matrix.platform }}
          --output "$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - name: Build Linux runtime
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: >-
          node scripts/release/build-ocr-runtime.mjs
          --platform ${{ matrix.platform }}
          --output "$RUNNER_TEMP/ocr-runtime-${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/ocr-runtime-${{ matrix.platform }}
          if-no-files-found: error
