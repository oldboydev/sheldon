name: Release official plugin catalog

on:
  workflow_dispatch: {}
  # Weekly native validation keeps both Apple Silicon and Intel artifact smokes exercised between tags.
  schedule:
    - cron: '17 4 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ocr-runtime:
    uses: ./.github/workflows/build-ocr-runtime.yml

  official-catalog:
    needs: build-ocr-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: >-
          node scripts/release/prepare-youtube-runtime.mjs
          --output release/ytdlp-runtime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ocr-runtime-*
          path: release/runtime-artifacts
      - run: >-
          node scripts/release/stage-official-artifacts.mjs
          --source packages/plugins/official
          --runtime-artifacts release/runtime-artifacts
          --ytdlp-runtime release/ytdlp-runtime
          --output release/stage
      - id: published-at
        run: echo "value=$(node --input-type=module --eval \"console.log(new Date().toISOString())\")" >> "$GITHUB_OUTPUT"
      - run: >-
          node scripts/release/build-official-artifacts.mjs
          --input release/stage
          --output release/out
          --published-at ${{ steps.published-at.outputs.value }}
      - run: >-
          node scripts/release/assert-signed-macos-artifact-replacements.mjs
          --directory release/out
          --write-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-release-candidate
          path: release/out
          if-no-files-found: error

  sign-macos-artifacts:
    needs: official-catalog
    name: sign and notarize (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: official-release-candidate
          path: release/out
      - run: >-
          node scripts/release/verify-macos-artifact-signatures.mjs
          --directory release/out
          --platform ${{ matrix.platform }}
          --sign-and-notarize
        env:
          SHELDON_MACOS_SIGNING_IDENTITY: ${{ secrets.SHELDON_MACOS_SIGNING_IDENTITY }}
          SHELDON_MACOS_NOTARY_PROFILE: ${{ secrets.SHELDON_MACOS_NOTARY_PROFILE }}
      - run: >-
          node scripts/release/assert-signed-macos-artifact-replacements.mjs
          --directory release/out
          --platform ${{ matrix.platform }}
          --write-signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-${{ matrix.platform }}
          path: |
            release/out/*-${{ matrix.platform }}.zip
            release/out/signed-macos-${{ matrix.platform }}-checksums.json
          if-no-files-found: error

  assemble-official-catalog:
    needs: sign-macos-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: official-release-candidate
          path: release/out
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: signed-macos-*
          path: release/out
          merge-multiple: true
      - run: >-
          node scripts/release/assert-signed-macos-artifact-replacements.mjs
          --directory release/out
          --assert-replacements
      - run: rm -f release/out/macos-candidate-checksums.json release/out/signed-macos-*-checksums.json
      - run: >-
          node scripts/release/build-official-artifacts.mjs
          --refresh-catalog
          --output release/out
      - run: >-
          node scripts/release/sign-official-catalog.mjs
          --catalog release/out/catalog.json
          --signature release/out/catalog.sig
        env:
          SHELDON_OFFICIAL_CATALOG_SIGNING_KEY_PEM: ${{ secrets.SHELDON_OFFICIAL_CATALOG_SIGNING_KEY_PEM }}
      - run: >-
          node scripts/release/verify-official-release.mjs
          --directory release/out
          --public-key release/official-catalog-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-release
          path: release/out
          if-no-files-found: error

  smoke-official-artifacts:
    needs: assemble-official-catalog
    name: smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: official-release
          path: release/out
      - run: node scripts/release/smoke-official-artifacts.mjs --directory release/out

  verify-macos-notarization:
    needs: assemble-official-catalog
    name: verify macOS signature and notarization (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: official-release
          path: release/out
      - run: >-
          node scripts/release/verify-macos-artifact-signatures.mjs
          --directory release/out
          --platform ${{ matrix.platform }}
          --verify

  promote-official-catalog:
    needs: [smoke-official-artifacts, verify-macos-notarization]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: official-release
          path: release/out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: official-catalog
          name: Official plugin catalog
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/out/*
