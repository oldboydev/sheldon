name: Release official plugin catalog

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ocr-runtime:
    uses: ./.github/workflows/build-ocr-runtime.yml

  official-catalog:
    needs: build-ocr-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: >-
          node scripts/release/prepare-youtube-runtime.mjs
          --output release/ytdlp-runtime
      - uses: actions/download-artifact@v5
        with:
          pattern: ocr-runtime-*
          path: release/runtime-artifacts
      - run: >-
          node scripts/release/stage-official-artifacts.mjs
          --source packages/plugins/official
          --runtime-artifacts release/runtime-artifacts
          --ytdlp-runtime release/ytdlp-runtime
          --output release/stage
      - id: published-at
        run: echo "value=$(node --input-type=module --eval \"console.log(new Date().toISOString())\")" >> "$GITHUB_OUTPUT"
      - run: >-
          node scripts/release/build-official-artifacts.mjs
          --input release/stage
          --output release/out
          --published-at ${{ steps.published-at.outputs.value }}
      - run: >-
          node scripts/release/sign-official-catalog.mjs
          --catalog release/out/catalog.json
          --signature release/out/catalog.sig
        env:
          SHELDON_OFFICIAL_CATALOG_SIGNING_KEY_PEM: ${{ secrets.SHELDON_OFFICIAL_CATALOG_SIGNING_KEY_PEM }}
      - run: >-
          node scripts/release/verify-official-release.mjs
          --directory release/out
          --public-key release/official-catalog-public.pem
      - uses: actions/upload-artifact@v5
        with:
          name: official-release
          path: release/out
          if-no-files-found: error
  smoke-official-artifacts:
    needs: official-catalog
    name: smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v5
        with:
          name: official-release
          path: release/out
      - run: node scripts/release/smoke-official-artifacts.mjs --directory release/out

  verify-macos-notarization:
    needs: smoke-official-artifacts
    name: macOS signature and notarization (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: official-release
          path: release/out
      - run: >-
          node scripts/release/verify-macos-artifact-signatures.mjs
          --directory release/out
          --platform ${{ matrix.platform }}
        env:
          SHELDON_MACOS_SIGNING_IDENTITY: ${{ secrets.SHELDON_MACOS_SIGNING_IDENTITY }}
          SHELDON_MACOS_NOTARY_PROFILE: ${{ secrets.SHELDON_MACOS_NOTARY_PROFILE }}

  promote-official-catalog:
    needs: verify-macos-notarization
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: official-release
          path: release/out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: official-catalog
          name: Official plugin catalog
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/out/*
